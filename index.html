<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geneseon Academy - SSC, HSC & Job Preparation Platform</title>
  <meta name="description" content="Bangladesh's smartest all-in-one education platform for SSC, HSC, BCS, and Job Preparation. Live courses, model exams, question bank, and AI study assistant.">
  <meta name="theme-color" content="#991B1B">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/images/pwa-icon-192.png">
  
  <!-- Google Fonts: Hind Siliguri (Bangla) + Outfit & Inter (English) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/learn.css">
  <link rel="stylesheet" href="css/exam.css">
  <link rel="stylesheet" href="css/question-bank.css">
  <link rel="stylesheet" href="css/ai.css">
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <!-- App Container -->
  <div id="app" class="app-root">
    <!-- Header / Navbar -->
    <header id="main-header" class="main-header"></header>

    <!-- Main Content Area (Rendered by router) -->
    <main id="main-content" class="main-content" role="main"></main>

    <!-- Global Modals Container -->
    <div id="modal-root" class="modal-root"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
  </div>

  <!-- Application Script (Universal Standalone Bundle) -->
  <script src="js/bundle.js"></script>
</body>
</html>
