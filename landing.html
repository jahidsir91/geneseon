<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geneseon Academy | কোর্স</title>
  <meta name="description" content="Geneseon Academy কোর্স দেখুন এবং আপনার অ্যাকাউন্টে প্রবেশ করুন বা নিবন্ধন করুন।" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      font-family: 'Hind Siliguri', sans-serif;
      color: #0f172a;
      background: #f0fdf4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --green: #15803d;
      --green-dark: #166534;
      --green-light: #dcfce7;
      --border: #d1fae5;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .topbar {
      min-height: 76px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      color: var(--green-dark);
      font: 800 1.35rem 'Outfit', sans-serif;
      text-decoration: none;
    }
    .account-actions { display: flex; gap: 10px; }
    .button {
      min-height: 42px;
      padding: 8px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--green);
      border-radius: 999px;
      background: #fff;
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }
    .button-primary { background: var(--green); color: #fff; }
    .button:hover { filter: brightness(.95); }

    main { width: min(1100px, calc(100% - 32px)); margin: 48px auto; }
    h1 {
      margin: 0 0 28px;
      color: var(--green-dark);
      text-align: center;
      font: 700 clamp(1.8rem, 4vw, 2.4rem) 'Outfit', 'Hind Siliguri', sans-serif;
    }
    .filter-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }
    .filter-button {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-weight: 600;
    }
    .filter-button:hover, .filter-button.active {
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }
    .courses-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .course-card {
      min-height: 112px;
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
    }
    .course-card[hidden] { display: none; }
    .course-category {
      flex: 0 0 auto;
      min-width: 56px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--green-light);
      color: var(--green-dark);
      text-align: center;
      font-size: .85rem;
      font-weight: 700;
    }
    .course-card h2 { margin: 0; font-size: 1rem; line-height: 1.45; }

    @media (max-width: 760px) {
      .courses-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .topbar { min-height: 68px; padding: 0 16px; }
      .brand { font-size: 1.1rem; }
      .account-actions { gap: 6px; }
      .button { min-height: 38px; padding: 6px 12px; font-size: .9rem; }
      main { margin: 32px auto; }
      .courses-grid { grid-template-columns: 1fr; }
      .course-card { min-height: 88px; padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Geneseon Academy">Geneseon Academy</a>
    <div class="account-actions">
      <a class="button" href="index.html#/login">সাইন ইন</a>
      <a class="button button-primary" href="index.html#/register">সাইন আপ</a>
    </div>
  </header>

  <main>
    <h1>কোর্সসমূহ</h1>
    <div class="filter-bar" role="group" aria-label="কোর্সের ধরন">
      <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">সব কোর্স</button>
      <button class="filter-button" type="button" data-filter="ssc" aria-pressed="false">SSC</button>
      <button class="filter-button" type="button" data-filter="hsc" aria-pressed="false">HSC</button>
      <button class="filter-button" type="button" data-filter="bcs" aria-pressed="false">BCS</button>
      <button class="filter-button" type="button" data-filter="job" aria-pressed="false">চাকরি প্রস্তুতি</button>
    </div>
    <section class="courses-grid" aria-label="কোর্সের তালিকা">
      <article class="course-card" data-category="ssc">
        <span class="course-category">SSC</span>
        <h2>SSC বিজ্ঞান সম্পূর্ণ কোর্স ২০২৫</h2>
      </article>
      <article class="course-card" data-category="hsc">
        <span class="course-category">HSC</span>
        <h2>HSC গণিত মাস্টারক্লাস</h2>
      </article>
      <article class="course-card" data-category="bcs">
        <span class="course-category">BCS</span>
        <h2>৪৬তম BCS প্রিলিমিনারি সম্পূর্ণ প্যাকেজ</h2>
      </article>
      <article class="course-card" data-category="job">
        <span class="course-category">চাকরি</span>
        <h2>ব্যাংক জব প্রস্তুতি — সম্পূর্ণ গাইড</h2>
      </article>
      <article class="course-card" data-category="ssc">
        <span class="course-category">SSC</span>
        <h2>SSC ইংরেজি গ্রামার ও কম্পোজিশন</h2>
      </article>
      <article class="course-card" data-category="hsc">
        <span class="course-category">HSC</span>
        <h2>HSC রসায়ন ১ম ও ২য় পত্র</h2>
      </article>
    </section>
  </main>

  <script>
    const filterButtons = document.querySelectorAll('.filter-button');
    const courseCards = document.querySelectorAll('.course-card');
    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(filterButton => {
          const isActive = filterButton === button;
          filterButton.classList.toggle('active', isActive);
          filterButton.setAttribute('aria-pressed', String(isActive));
        });
        const filter = button.dataset.filter;
        courseCards.forEach(card => {
          card.hidden = filter !== 'all' && card.dataset.category !== filter;
        });
      });
    });
  </script>
</body>
</html>
